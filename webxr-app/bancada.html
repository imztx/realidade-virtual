<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bancada</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 24px;
        max-width: 1000px;
        margin-inline: auto;
        font-family: system-ui, -apple-system, sans-serif;
        line-height: 1.5;
        color: #1a1a1a;
        background: #fafafa;
      }
      h1 { font-size: 1.6rem; }
      h2 { font-size: 1.25rem; margin-top: 2rem; border-bottom: 2px solid #ddd; padding-bottom: 4px; }
      h3 { font-size: 1.05rem; margin-top: 1.5rem; }
      table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 0.9rem; }
      th, td { border: 1px solid #ccc; padding: 8px 10px; text-align: left; vertical-align: top; }
      th { background: #efefef; }
      #sondar {
        font-size: 1.1rem;
        padding: 14px 28px;
        margin: 16px 0;
        cursor: pointer;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: white;
      }
      #sondar:hover { background: #1d4ed8; }
      .diario { padding: 8px 12px; margin: 4px 0; border-radius: 6px; font-size: 0.9rem; }
      .diario-nota   { background: #eef2ff; color: #3730a3; }
      .diario-alerta { background: #fef3c7; color: #92400e; }
      .diario-falha  { background: #fee2e2; color: #991b1b; }
    </style>
  </head>
  <body>
    <h1>Bancada (estado deste módulo)</h1>
    <p>Esta página não desenha nada. Ela declara o domínio e os regimes, e pergunta
       a este aparelho o que ele suporta.</p>

    <div id="relatorio"></div>

    <h2>Sonda completa (exige um toque)</h2>
    <p>A sonda imersiva só abre a partir de um gesto de quem usa. Toque no botão:</p>
    <button id="sondar">Sondar este aparelho</button>
    <div id="sonda"></div>

    <h2>Diário</h2>
    <div id="diario"></div>

    <script type="module" src="/src/bancada/main.ts"></script>
  </body>
</html>
